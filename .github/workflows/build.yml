name: build

on:
  push:
    branches: [dismiss-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build x64 MSIX
        working-directory: SSH
        shell: pwsh
        run: dotnet build --configuration Release -p:Platform=x64 -p:AppxPackageDir="AppPackages\x64\" -p:AppxPackageSigningEnabled=false

      - name: List packages
        shell: pwsh
        run: Get-ChildItem SSH/AppPackages -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SSH-x64-msix
          path: SSH/AppPackages/
          if-no-files-found: error
